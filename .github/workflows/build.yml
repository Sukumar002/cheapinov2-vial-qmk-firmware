name: Build Cheapino Vial firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cheapino-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Cheapino Vial UF2
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out Vial-QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          path: qmk_firmware
          submodules: recursive

      - name: Apply Cheapino Vial default-combo initialization
        run: |
          git -C qmk_firmware apply --check ../patches/vial-default-combos.patch
          git -C qmk_firmware apply ../patches/vial-default-combos.patch

      - name: Install Cheapino keyboard source
        run: |
          rm -rf qmk_firmware/keyboards/cheapino
          cp -R cheapino qmk_firmware/keyboards/cheapino

      - name: Build firmware
        working-directory: qmk_firmware
        run: qmk compile -kb cheapino -km vial

      - name: Show generated firmware
        working-directory: qmk_firmware
        run: find . -maxdepth 2 -type f -name '*.uf2' -print

      - name: Upload UF2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: cheapino-vial-firmware-${{ github.sha }}
          path: |
            qmk_firmware/*.uf2
            qmk_firmware/.build/**/*.uf2
          if-no-files-found: error
          retention-days: 30
